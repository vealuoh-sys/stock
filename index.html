<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MMC Pathology Inventory Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
<style>
body{margin:0;font-family:Arial;background:#eef5fb;color:#233}
.sidebar{width:240px;height:100vh;position:fixed;background:#06466f;color:white;padding:20px}
.main{margin-left:270px;padding:25px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 4px 15px #0002}
button{background:#0969b4;color:white;border:0;padding:10px 15px;border-radius:8px;cursor:pointer}
table{width:100%;border-collapse:collapse;background:white}
th{background:#0969b4;color:white}
td,th{padding:10px;border:1px solid #ddd}
input{padding:10px;margin:5px}
.preview{max-height:250px;overflow:auto}
</style>
</head>
<body>
<div class="sidebar">
<h2>🏥 MMC Pathology</h2>
<p>Dashboard</p><p>Inventory</p><p>Import Stock</p><p>Reports</p>
</div>

<div class="main">
<div class="card">
<h1>Pathology Inventory Dashboard</h1>
<p>Upload Word stock sheet. System reads the table columns automatically.</p>
<input type="file" id="upload" accept=".docx">
<button onclick="scanDoc()">Scan Document</button>
<p id="msg"></p>
</div>

<div class="card" id="previewBox" style="display:none">
<h2>Import Preview</h2>
<div class="preview">
<table>
<thead><tr><th>S.No</th><th>Item</th><th>Quantity</th><th>Usage</th><th>Available</th><th>Required</th></tr></thead>
<tbody id="preview"></tbody>
</table>
</div>
<button onclick="confirmImport()">Confirm Import</button>
</div>

<div class="card">
<h2>Inventory</h2>
<input placeholder="Search" onkeyup="search(this.value)">
<table>
<thead><tr><th>S.No</th><th>Item</th><th>Category</th><th>Qty</th><th>Usage</th><th>Stock</th><th>Required</th></tr></thead>
<tbody id="table"></tbody>
</table>
</div>
</div>

<script>
let inventory=[];
let imported=[];

function draw(list=inventory){
let t=document.getElementById("table");
t.innerHTML="";
list.forEach((r,i)=>{
t.innerHTML+=`<tr>
<td>${i+1}</td><td>${r.item}</td><td>${r.category}</td>
<td>${r.qty}</td><td>${r.usage}</td><td>${r.stock}</td><td>${r.required}</td>
</tr>`;
});
}

async function scanDoc(){
let file=document.getElementById("upload").files[0];
if(!file)return alert("Select Word file");

msg.innerHTML="Reading table...";

let result=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});
let div=document.createElement("div");
div.innerHTML=result.value;

let rows=[...div.querySelectorAll("table tr")];

imported=[];

rows.forEach((row,i)=>{
let cells=[...row.children].map(x=>x.innerText.trim());

if(i>0 && cells.length>=5){
imported.push({
item:cells[1]||"",
category:"Imported",
qty:cells[2]||"",
usage:cells[3]||"",
stock:cells[4]||"",
required:cells[5]||""
});
}
});

preview.innerHTML="";
imported.forEach((x,i)=>{
preview.innerHTML+=`<tr><td>${i+1}</td><td>${x.item}</td><td>${x.qty}</td><td>${x.usage}</td><td>${x.stock}</td><td>${x.required}</td></tr>`;
});

previewBox.style.display="block";
msg.innerHTML="Table detected. Review and confirm.";
}

function confirmImport(){
inventory=imported;
localStorage.setItem("mmc_inventory",JSON.stringify(inventory));
draw();
alert("Inventory imported successfully");
}

function search(v){
draw(inventory.filter(x=>JSON.stringify(x).toLowerCase().includes(v.toLowerCase())));
}

inventory=JSON.parse(localStorage.getItem("mmc_inventory"))||[];
draw();
</script>
</body>
</html>
